<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Public Safety - Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    }

    .login-container {
        width: 100%;
        max-width: 430px;
        padding: 20px;
    }

    .login-box {
        background: white;
        padding: 40px 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 15px;
        background: #1565c0;
        color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
    }

    h1 {
        text-align: center;
        color: #1565c0;
        font-size: 26px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        color: #333;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    .input-group input:focus {
        border-color: #1565c0;
        box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #1565c0;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #0d47a1;
        transform: translateY(-1px);
    }

    .register-text {
        text-align: center;
        margin-top: 22px;
        color: #666;
        font-size: 14px;
    }

    .register-text a {
        color: #1565c0;
        text-decoration: none;
        font-weight: bold;
    }

    .register-text a:hover {
        text-decoration: underline;
    }

    .safety-note {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #999;
    }
</style>
```

</head>

<body>

```
<div class="login-container">

    <div class="login-box">

        <div class="logo">🛡</div>

        <h1>Public Safety</h1>

        <p class="subtitle">
            Login to access your safety monitoring system
        </p>

        <form action="login" method="post">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <p class="safety-note">
            Your safety and well-being matter to us.
        </p>

    </div>

</div>
```

</body>

</html>
